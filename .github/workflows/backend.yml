# Compila el servidor y corre las pruebas de la API contra él en cada cambio.
name: Servidor

on:
  push:
    branches: [main]
    paths: ['factufacil-backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['factufacil-backend/**']

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factufacil-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -q package -DskipTests
      - name: Arrancar el servidor
        run: |
          nohup java -jar target/factufacil-backend-1.0.0.jar > servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/salud && break; sleep 2; done
          sleep 3
      - run: python3 pruebas/prueba_api.py
      - if: failure()
        run: tail -100 servidor.log
