# Publica la interfaz en GitHub Pages cada vez que cambia factufacil-frontend en main.
# Si la variable del repositorio VITE_API_URL tiene la dirección del servidor (Render),
# la interfaz publicada usa la API; si está vacía, funciona sola con datos de prueba.
name: Publicar interfaz

on:
  push:
    branches: [main]
    paths: ['factufacil-frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factufacil-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: factufacil-frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --mode production
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: factufacil-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
