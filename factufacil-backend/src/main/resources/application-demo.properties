# Base H2 en modo MySQL: usa el mismo script SQL que MySQL/MariaDB.
spring.datasource.url=jdbc:h2:file:./data/factufacil;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=false
factufacil.datos-demo=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2
