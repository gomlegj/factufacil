spring.application.name=factufacil
server.port=${PORT:8080}

# Perfil por defecto: demo con H2 en archivo (no necesita instalar nada).
# Para MySQL/MariaDB: --spring.profiles.active=mysql
spring.profiles.default=demo

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT: cambiar la clave en produccion (variable de entorno FACTUFACIL_JWT_SECRET)
factufacil.jwt.secret=${FACTUFACIL_JWT_SECRET:factufacil-clave-de-desarrollo-cambiar-en-produccion-2026}
factufacil.jwt.access-minutos=30
factufacil.jwt.refresh-dias=7
factufacil.cors.origenes=${FACTUFACIL_CORS:http://localhost:5173,http://127.0.0.1:5173}
factufacil.datos-demo=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
